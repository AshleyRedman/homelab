name: caddy

# HTTPS reverse proxy for the tailnet hostname (see conf/Caddyfile).
services:
    caddy:
        container_name: caddy
        image: caddy:latest
        # Host networking so the Caddyfile can reach every app on localhost,
        # and Caddy can bind 80/443 and its service ports (9001+) directly.
        network_mode: host
        environment:
            - TZ=Europe/London
        env_file:
            - ../../.env
        volumes:
            # Directory (not single-file) mount so git updates to the Caddyfile
            # are seen inside the container.
            - ./conf:/etc/caddy:ro
            - /mnt/nvme/caddy/data:/data
            - /mnt/nvme/caddy/config:/config
            # tailscaled socket, used to get the *.ts.net certificate.
            - /var/run/tailscale:/var/run/tailscale
        restart: unless-stopped
        healthcheck:
            # 127.0.0.1, not localhost: the admin API listens on IPv4 only and
            # localhost resolves to ::1 first in the container.
            test:
                [
                    'CMD',
                    'wget',
                    '-qO',
                    '/dev/null',
                    'http://127.0.0.1:2019/config/'
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
