name: jellyfin

services:
    jellyfin:
        container_name: jellyfin
        image: jellyfin/jellyfin:latest
        user: '977:977'
        environment:
            - TZ=Europe/London
        volumes:
            - /mnt/nvme/jellyfin/config:/config
            - /mnt/nvme/jellyfin/cache:/cache
            - /mnt/media:/media
        ports:
            - 8096:8096
            - 8920:8920
            - 7359:7359/udp
        restart: unless-stopped
        healthcheck:
            test:
                ['CMD-SHELL', 'curl -f http://localhost:8096/health || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
