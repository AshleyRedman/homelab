# Make network-online.target mean "eth0 has a routable address", so the
# UNAS NFS mount (and Docker after it) only start once the LAN is reachable.
#
# netplan marks eth0 optional, which means:
#   - the default wait-online would ignore eth0, and
#   - netplan's 10-netplan.conf adds a condition that skips this service
#     entirely when no interface is required.
# This file sorts after 10-netplan.conf, so the empty Condition below clears
# netplan's condition (an empty Condition*= resets all earlier conditions);
# the stock CAP_NET_ADMIN condition is then restored.
#
# Timeout keeps boot from hanging if the cable is unplugged.
[Unit]
ConditionPathIsSymbolicLink=
ConditionCapability=CAP_NET_ADMIN

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=eth0:routable --timeout=60
